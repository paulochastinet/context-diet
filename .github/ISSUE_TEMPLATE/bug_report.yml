name: Bug report
description: Something is missing, miscounted or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to see, and what did you get instead?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: npx context-diet --agent claude --verbose
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant output. Please remove secrets, tokens and private paths.
      render: text
  - type: dropdown
    id: agent
    attributes:
      label: Agent(s) involved
      multiple: true
      options: [Claude Code, Codex CLI, Gemini CLI, Cursor, VS Code / Copilot, Not agent-specific]
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: context-diet 0.1.0, Node 22.11, macOS 15
    validations:
      required: true
